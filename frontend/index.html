<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>House Price Predictor</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>House price predictor</h1>
    <p class="sub">Enter the details of an area to estimate its median house price.</p>

    <form id="form" novalidate>
      <label>
        Median income
        <input type="number" id="MedInc" step="any" min="0" placeholder="e.g. 3.5" required>
        <small>In tens of thousands of dollars</small>
      </label>

      <label>
        House age
        <input type="number" id="HouseAge" step="1" min="0" placeholder="e.g. 25" required>
        <small>Age in years, whole number</small>
      </label>

      <label>
        Population
        <input type="number" id="Population" step="any" min="0" placeholder="e.g. 1200" required>
        <small>Number of people in the area</small>
      </label>

      <button type="submit" id="submit">Predict price</button>
    </form>

    <section id="result" aria-live="polite" hidden></section>
  </main>
  <script src="script.js"></script>
</body>
</html>
